[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "building-code-kb"
version = "0.2.0"
description = "建筑法规条文检索、原文定位与辅助问答"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
building-kb = "building_kb.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
building_kb = ["web/static/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["archive", "var", "data", "docs/history"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["building_kb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
major_version_zero = true
