name: Complete private assets
on:
  workflow_dispatch:
    inputs:
      transport_release_id:
        required: true
        type: string
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble complete private archives
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSPORT_RELEASE_ID: ${{ inputs.transport_release_id }}
        run: python3 .github/scripts/private_complete.py
