name: Publish individual private PDFs
on:
  workflow_dispatch:
    inputs:
      pdf_release_id:
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: publish-private-pdfs
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish PDFs and catalog
        env:
          GH_TOKEN: ${{ github.token }}
          PDF_RELEASE_ID: ${{ inputs.pdf_release_id }}
        run: python3 .github/scripts/private_pdfs.py
